[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphx-sim"
version = "1.0.0"
description = "Simulated MorphX diagnostic device that syncs measurements to a central server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
morphx-agent = "morphx.agent.__main__:main"
morphx-server = "morphx.server.__main__:main"

[tool.setuptools.packages.find]
include = ["morphx*"]

[tool.setuptools.package-data]
"morphx.server" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# FastAPI's TestClient warns about httpx; nothing to act on here
filterwarnings = ["ignore:Using .httpx. with"]
